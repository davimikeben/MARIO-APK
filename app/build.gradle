plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.20'
}

android {
    namespace 'com.davimikeben.marioapk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.davimikeben.marioapk'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        // Emulação N64 requer código nativo via NDK
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        // Manter a ROM e recursos dentro do APK
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Otimização extrema: remover recursos não usados e comprimir assets
    aaptOptions {
        compressPngs true
        // Não comprimir a ROM dentro dos assets para permitir leitura direta via AssetManager
        noCompress 'rom'
    }

    packagingOptions {
        // Evitar duplicatas de bibliotecas nativas
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        mergeJniLibsPickFirst '**/*.so'
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['assets']
            }
            jniLibs {
                srcDirs = ['libs']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
