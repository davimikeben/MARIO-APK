plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseVersionName = System.getenv("ANDROID_VERSION_NAME")?.trim()
def releaseVersionCodeRaw = System.getenv("ANDROID_VERSION_CODE")?.trim()
if (releaseVersionCodeRaw && !releaseVersionCodeRaw.isInteger()) {
    throw new GradleException("ANDROID_VERSION_CODE must be an integer")
}
def releaseVersionCode = releaseVersionCodeRaw ? releaseVersionCodeRaw.toInteger() : 1
def appVersionName = (releaseVersionName ?: "1.0").replaceFirst("^v", "")
if (releaseVersionCode <= 0) {
    throw new GradleException("ANDROID_VERSION_CODE must be positive")
}

def releaseSigningKeys = [
    "ANDROID_KEYSTORE_PATH",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEY_ALIAS",
    "ANDROID_KEY_PASSWORD"
]
def releaseSigningValues = releaseSigningKeys.collectEntries { key -> [(key): System.getenv(key)] }
def hasAnyReleaseSigningValue = releaseSigningValues.values().any { it != null && !it.trim().isEmpty() }
def hasCompleteReleaseSigning = releaseSigningValues.values().every { it != null && !it.trim().isEmpty() }
if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigning) {
    throw new GradleException("Release signing requires all ANDROID_KEYSTORE_* environment variables")
}

android {
    namespace 'com.davimikeben.extremen64'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.davimikeben.extremen64"
        minSdk 24
        targetSdk 34
        versionCode releaseVersionCode
        versionName appVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-O2 -ffunction-sections -fdata-sections"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasCompleteReleaseSigning) {
            release {
                storeFile file(releaseSigningValues["ANDROID_KEYSTORE_PATH"])
                storePassword releaseSigningValues["ANDROID_KEYSTORE_PASSWORD"]
                keyAlias releaseSigningValues["ANDROID_KEY_ALIAS"]
                keyPassword releaseSigningValues["ANDROID_KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release builds are signed only when the protected tag workflow injects its secrets.
            if (hasCompleteReleaseSigning) {
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/DEPENDENCIES'
            excludes += '/META-INF/LICENSE*'
            excludes += '/META-INF/NOTICE*'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
