name: Android Debug CI and ROM verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # actions/setup-java v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # android-actions/setup-android v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # gradle/actions v6
        with:
          gradle-version: '8.2.1'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify ROM inside APK
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile

          rom_path = "app/src/main/assets/rom/Super Mario 64 (USA).z64"
          apk_path = "app/build/outputs/apk/debug/app-debug.apk"
          apk_entry = "assets/rom/Super Mario 64 (USA).z64"

          if not os.path.isfile(rom_path) or os.path.getsize(rom_path) == 0:
              raise SystemExit("ROM source asset is missing or empty")
          if not os.path.isfile(apk_path):
              raise SystemExit("Debug APK was not produced")

          with open(rom_path, "rb") as source:
              original = source.read()
          with zipfile.ZipFile(apk_path, "r") as apk:
              packaged = apk.read(apk_entry)

          source_hash = hashlib.sha256(original).hexdigest()
          packaged_hash = hashlib.sha256(packaged).hexdigest()
          if original != packaged:
              raise SystemExit("ROM in APK differs from source asset")

          print(f"ROM path: {apk_entry}")
          print(f"ROM bytes: {len(packaged)}")
          print(f"ROM SHA-256: {packaged_hash}")
          print(f"APK bytes: {os.path.getsize(apk_path)}")
          with open(apk_path, "rb") as built_apk:
              print(f"APK SHA-256: {hashlib.sha256(built_apk.read()).hexdigest()}")
          PY

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: extreme-n64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
