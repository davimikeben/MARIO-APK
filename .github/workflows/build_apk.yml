name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Fetch libretro core (mupen64plus_next_gles3)
        run: bash scripts/fetch_libretro_core.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=1
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify ROM inside APK
        run: bash scripts/verify_apk.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign APK (debug)
        id: sign_apk
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out app/build/outputs/apk/release/sm64_emulator-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          echo "apk_path=app/build/outputs/apk/release/sm64_emulator-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Rename for release
        run: |
          cp "${{ steps.sign_apk.outputs.apk_path }}" sm64_emulator-release.apk
          ls -la sm64_emulator-release.apk
          sha256sum sm64_emulator-release.apk | tee sm64_emulator-release.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64_emulator-release-apk
          path: |
            sm64_emulator-release.apk
            sm64_emulator-release.apk.sha256
          retention-days: 90

      - name: Attach to release (when triggered manually with tag)
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sm64_emulator-release.apk
            sm64_emulator-release.apk.sha256
          fail_on_unmatched_files: true
